<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Balance App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Life Balance</h1>
    <p class="muted">Frontend (Live Server) → Backend (Spring Boot)</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Categories</h2>
      <button id="btnLoadCategories">Load Categories</button>
      <pre id="categoriesOut" class="out"></pre>
    </section>

    <section class="card">
      <h2>Incomes (by userId)</h2>
      <div class="row">
        <input id="incomeUserId" type="number" placeholder="userId (ex: 1)" />
        <button id="btnLoadIncomes">Load Incomes</button>
      </div>
      <pre id="incomesOut" class="out"></pre>
    </section>

    <section class="card">
      <h2>Expenses (by userId)</h2>
      <div class="row">
        <input id="expenseUserId" type="number" placeholder="userId (ex: 1)" />
        <button id="btnLoadExpenses">Load Expenses</button>
      </div>
      <pre id="expensesOut" class="out"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
